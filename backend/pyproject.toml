[project]
name = "softsentry-backend"
version = "0.1.0"
description = "SoftSentry backend — SAM + Security platform API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "bcrypt>=4.1",
  "pyjwt>=2.8",
  "cryptography>=42.0",
  "redis>=5.0",
  "arq>=0.26",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "weasyprint>=62.0",
  "jinja2>=3.1",
  "croniter>=2.0",
  "prometheus-client>=0.20",
  "slowapi>=0.1.9",
  "orjson>=3.10",
  "structlog>=24.1",
]

[dependency-groups]
dev = [
  "ruff>=0.5",
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "anyio>=4.4",
  "aiosqlite>=0.20",
  "types-passlib",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W",     # pycodestyle + pyflakes
  "I",                # isort
  "B",                # bugbear
  "UP",               # pyupgrade
  "C4",               # comprehensions
  "SIM",              # simplify
  "RUF",              # ruff-specific
  "ASYNC",            # async-specific
  "S",                # bandit (security)
]
ignore = [
  "S101",  # allow assert in tests
  "B008",  # FastAPI Depends() in default args is idiomatic
  # TCH (flake8-type-checking) is intentionally NOT enabled: SQLAlchemy's
  # Mapped[...] annotations and Pydantic models resolve type hints at runtime,
  # so moving those imports into `if TYPE_CHECKING:` blocks breaks the ORM and
  # schema construction.
  "S105",  # token_type="access"/"bearer" string constants are not passwords
  "S106",  # same — keyword arg token_type=..., not a credential
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "B"]
"alembic/**/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["arq.*", "slowapi.*", "weasyprint.*", "croniter.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers --cov=app --cov-report=term-missing"
