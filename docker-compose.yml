name: softsentry

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    # No host port published — only the backend/worker reach Postgres over the
    # internal compose network (postgres:5432). Use `docker compose exec postgres
    # psql` for ad-hoc access instead of exposing the DB on the host.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    # No host port published — backend/worker reach Redis over the internal
    # compose network (redis:6379). Keep it off the host to shrink attack surface.
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # Apply DB migrations + seed the initial admin (idempotent) before serving.
    # Done here (not in the Dockerfile) so the worker, which reuses this image,
    # does not race on migrations.
    command:
      - sh
      - -c
      - >-
        uv run alembic upgrade head &&
        uv run python -m app.seed &&
        uv run uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # Directory (mounted below) holding built agent binaries + manifest.json,
      # served by the one-click installer + auto-update endpoints.
      AGENT_BINARY_DIR: /app/agent-binaries
    # Host port is parametrised (default 47800) to avoid colliding with anything
    # already bound on a shared server. Container still listens on 8000 internally.
    ports:
      - "${BACKEND_HOST_PORT:-47800}:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/agent-binaries:/app/agent-binaries
      - reports_data:/app/reports

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # Shares the backend image (which has an HTTP /health HEALTHCHECK), but the
    # worker serves no HTTP — disable the inherited healthcheck so it isn't unhealthy.
    healthcheck:
      disable: true
    command: ["uv", "run", "arq", "app.workers.WorkerSettings"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - ./backend/app:/app/app
      - reports_data:/app/reports

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* is baked into the client bundle at build time, so the
        # browser-facing API URL must point at the host/port the browser uses to
        # reach the backend (the server's domain/IP + BACKEND_HOST_PORT in prod).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    depends_on:
      - backend
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "${DASHBOARD_HOST_PORT:-47300}:3000"

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    ports:
      - "${PROMETHEUS_HOST_PORT:-47900}:9090"
    profiles: ["observability"]

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
      # Datasource + dashboard-provider configs, and the dashboard JSON they load.
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_HOST_PORT:-47301}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    profiles: ["observability"]

volumes:
  pg_data:
  redis_data:
  reports_data:
  prom_data:
  grafana_data: