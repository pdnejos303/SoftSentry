name: softsentry

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    # ไม่ expose port ออก host — backend/worker เข้าถึง Postgres ผ่าน internal network
    # (postgres:5432) เท่านั้น ใช้ `docker compose exec postgres psql` สำหรับ ad-hoc access
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    # ไม่ expose port ออก host — backend/worker ใช้ internal network (redis:6379) เท่านั้น
    # ปิด host port เพื่อลด attack surface
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # รัน DB migration + seed admin เริ่มต้น (idempotent) ก่อน serve
    # ทำที่นี่ (ไม่ใช่ใน Dockerfile) เพื่อกัน worker ที่ใช้ image เดียวกัน race กันบน migration
    command:
      - sh
      - -c
      - >-
        uv run alembic upgrade head &&
        uv run python -m app.seed &&
        uv run uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # รอ agent-builder cross-compile binary + เขียน manifest ลง volume ให้เสร็จก่อน
      # ไม่งั้น download endpoint จะตอบ 503 "No agent binary available"
      agent-builder:
        condition: service_completed_successfully
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # โฟลเดอร์ที่เก็บ agent binary + manifest.json สำหรับ one-click installer และ auto-update endpoint
      AGENT_BINARY_DIR: /app/agent-binaries
    # host port ปรับได้ (default 47800) ป้องกันชนกับ service อื่นบน shared server
    # container ยังฟัง port 8000 ภายใน
      REPORTS_DIR: /app/reports
    ports:
      - "${BACKEND_HOST_PORT:-47800}:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      # ใช้ named volume ที่ agent-builder เขียน binary + manifest ลงไป (แทน bind-mount
      # โฟลเดอร์ใน repo) — git ไม่ต้องแบก .exe และ binary ถูก build สดทุกครั้งที่ compose build
      - agent_binaries:/app/agent-binaries
      - reports_data:/app/reports

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # ใช้ image เดียวกับ backend (มี HTTP /health HEALTHCHECK) แต่ worker ไม่เปิด HTTP
    # ปิด inherited healthcheck เพื่อกัน false-unhealthy
    healthcheck:
      disable: true
    command: ["uv", "run", "arq", "app.workers.WorkerSettings"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      REPORTS_DIR: /app/reports
    volumes:
      - ./backend/app:/app/app
      - reports_data:/app/reports

  # cross-compile agent (windows/amd64) แล้ว publish ลง named volume `agent_binaries`
  # ที่ backend ใช้เสิร์ฟ one-click installer + auto-update — รันครั้งเดียวแล้ว exit 0
  # (backend รอด้วย depends_on: condition: service_completed_successfully)
  #
  # build เกิด "ตอน container รัน" จาก source ที่ bind-mount มา (./agent:/src-ro:ro)
  # ไม่ใช่ตอน image build → ทุก `docker compose up` recompile จาก source ล่าสุดเสมอ
  # **ไม่ต้องสั่ง --build ก็ได้ binary ใหม่** (กัน stale-binary trap เดิม)
  # bump version: AGENT_VERSION=1.0.0 docker compose up -d agent-builder backend
  agent-builder:
    build:
      context: ./agent
      dockerfile: Dockerfile
    restart: "no"
    environment:
      AGENT_VERSION: ${AGENT_VERSION:-0.1.0}
    volumes:
      # source (read-only) → build-publish.sh copy ไป /build แล้วคอมไพล์
      - ./agent:/src-ro:ro
      - agent_binaries:/export
      # cache go modules + build cache ให้ recompile รอบถัดไปเร็ว (ข้าม cold 14s)
      - agent_gomod:/go/pkg/mod
      - agent_gobuild:/root/.cache/go-build

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* ถูก bake เข้า client bundle ตอน build-time
        # URL ที่ browser ใช้ต้องตรงกับ host/port จริงที่เบราว์เซอร์เห็น (ไม่ใช่ internal container name)
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    depends_on:
      - backend
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "${DASHBOARD_HOST_PORT:-47300}:3000"

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    ports:
      - "${PROMETHEUS_HOST_PORT:-47900}:9090"
    profiles: ["observability"]

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
      # config datasource + dashboard-provider และไฟล์ dashboard JSON ที่โหลดอัตโนมัติ
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_HOST_PORT:-47301}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    profiles: ["observability"]

volumes:
  pg_data:
  redis_data:
  reports_data:
  agent_binaries:
  # cache สำหรับ agent-builder runtime-build (ให้ recompile รอบถัดไปเร็ว)
  agent_gomod:
  agent_gobuild:
  prom_data:
  grafana_data:
