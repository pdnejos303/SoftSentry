apiVersion: 1

providers:
  - name: SoftSentry
    orgId: 1
    folder: SoftSentry
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      # JSON dashboards are mounted here (see docker-compose grafana volumes).
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
