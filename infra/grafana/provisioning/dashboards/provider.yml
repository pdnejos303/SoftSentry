apiVersion: 1

providers:
  - name: SoftSentry
    orgId: 1
    folder: SoftSentry
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      # JSON dashboard mount ไว้ที่นี่ (ดู grafana volumes ใน docker-compose)
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
