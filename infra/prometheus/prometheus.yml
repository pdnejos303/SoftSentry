global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Agent ไม่ถูก scrape โดยตรง (อยู่หลัง NAT และตาม docs/02-architecture.md
  # "ไม่ส่ง telemetry นอก backend") — agent push scan timing/size ผ่าน API
  # แล้ว backend re-export เป็น metric ที่นี่แทน
  - job_name: softsentry-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
