global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Agents are never scraped directly (they sit behind NAT and, per
  # docs/02-architecture.md, "ไม่ส่ง telemetry นอก backend"). They push scan
  # timing/size through the API and the backend re-exports it here.
  - job_name: softsentry-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
